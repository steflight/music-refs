# Nginx Reverse Proxy and Static Files Server Configuration for Music Refs
# Domain: music-refs-dev.kladriva.ca
# SSL/TLS & SNI Configuration (Task #6)

# HTTP Server Block - Redirect all HTTP traffic to HTTPS securely
server {
    listen 80;
    listen [::]:80;
    server_name music-refs-dev.kladriva.ca;

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Virtual Host Server Block with SNI & Modern TLS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name music-refs-dev.kladriva.ca;

    # SSL / TLS Certificate and Key
    ssl_certificate /workspace/music-refs/certs/music-refs-dev.kladriva.ca.crt;
    ssl_certificate_key /workspace/music-refs/certs/music-refs-dev.kladriva.ca.key;

    # Supported SSL/TLS Protocols & Ciphers (SNI & Modern Security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Caching and Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /workspace/music-refs;
    index index.html;

    client_max_body_size 25m;

    # Serve static assets and frontend SPA home page UI at root URL (/)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Serve static assets explicitly (JavaScript, CSS, images)
    location /src/ {
        alias /workspace/music-refs/src/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to backend FastAPI service (port 8084 — ADA reste sur 8082)
    location /api/ {
        proxy_pass http://127.0.0.1:8084/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Health check & API documentation
    location /health {
        proxy_pass http://127.0.0.1:8084/health;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8084/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8082/openapi.json;
    }

    # Custom branded 404 error page handling
    error_page 404 /404.html;
    location = /404.html {
        root /workspace/music-refs;
        internal;
    }
}
