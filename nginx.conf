# Nginx Reverse Proxy and Static Files Server Configuration for Music Refs
# Domain: music-refs-dev.kladriva.ca

server {
    listen 80;
    server_name music-refs-dev.kladriva.ca;

    root /workspace/music-refs;
    index index.html;

    client_max_body_size 25m;

    # Serve static assets and frontend SPA home page UI at root URL (/)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Serve static assets explicitly (JavaScript, CSS, images)
    location /src/ {
        alias /workspace/music-refs/src/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to backend FastAPI service
    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Health check & API documentation
    location /health {
        proxy_pass http://127.0.0.1:8082/health;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8082/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8082/openapi.json;
    }

    # Custom branded 404 error page handling
    error_page 404 /404.html;
    location = /404.html {
        root /workspace/music-refs;
        internal;
    }
}
